<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Chat</title>
    <style>
        #chat-page { margin: 20px; }
        #chat-area { height: 400px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .event { color: gray; font-style: italic; }
        .chat-message { margin: 5px 0; }
    </style>
</head>
<body>
<div id="chat-page">
    <div id="chat-area"></div>

    <form id="nameForm">
        <label for="name">Your Name:</label>
        <input type="text" id="name" placeholder="Enter your name" required>
        <button type="submit">Join Chat</button>
    </form>

    <form id="messageForm" style="display:none;">
        <input type="text" id="message" placeholder="Type a message..." required>
        <button type="submit">Send</button>
        <button type="button" id="disconnect">Leave</button>
    </form>
</div>

<!-- SockJS & STOMP -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    let stompClient = null;

    function connect() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, onConnected, onError);
    }

    function onConnected() {
        stompClient.subscribe('/topic/public', onMessageReceived);
        const name = document.getElementById('name').value.trim();
        stompClient.send("/app/chat.addUser", {}, JSON.stringify({sender: name, type: 'JOIN'}));
        document.getElementById('nameForm').style.display = 'none';
        document.getElementById('messageForm').style.display = 'block';
    }

    function onError(error) {
        console.error('WebSocket error:', error);
    }

    function sendMessage() {
        const messageContent = document.getElementById('message').value.trim();
        if (messageContent && stompClient) {
            const chatMessage = {
                sender: document.getElementById('name').value.trim(),
                content: messageContent,
                type: 'CHAT'
            };
            stompClient.send("/app/chat.sendMessage", {}, JSON.stringify(chatMessage));
            document.getElementById('message').value = '';
        }
    }

    function onMessageReceived(payload) {
        const message = JSON.parse(payload.body);
        const chatArea = document.getElementById('chat-area');
        const messageElement = document.createElement('div');
        messageElement.classList.add('chat-message');

        if (message.type === 'JOIN') {
            messageElement.classList.add('event');
            messageElement.innerHTML = `<i>${message.sender} joined!</i>`;
        } else if (message.type === 'LEAVE') {
            messageElement.classList.add('event');
            messageElement.innerHTML = `<i>${message.sender} left!</i>`;
        } else {
            messageElement.innerHTML = `<strong>${message.sender}:</strong> ${message.content}`;
        }

        chatArea.appendChild(messageElement);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    // Event listeners
    document.getElementById('nameForm').addEventListener('submit', function(e) {
        e.preventDefault();
        connect();
    });

    document.getElementById('messageForm').addEventListener('submit', function(e) {
        e.preventDefault();
        sendMessage();
    });

    document.getElementById('disconnect').addEventListener('click', function() {
        if (stompClient) {
            const name = document.getElementById('name').value.trim();
            stompClient.send("/app/chat.addUser", {}, JSON.stringify({sender: name, type: 'LEAVE'}));
            stompClient.disconnect();
        }
        document.getElementById('messageForm').style.display = 'none';
        document.getElementById('nameForm').style.display = 'block';
        document.getElementById('chat-area').innerHTML = '';
    });
</script>
</body>
</html>
